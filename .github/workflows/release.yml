name: Release AAB (signed, Gradle — no EAS)

# Builds the AnswerForU Android release bundle with plain Gradle in CI:
# npm install -> expo prebuild (generates android/) -> CI-only signing patch
# of the generated tree -> ./gradlew bundleRelease with the env-var keystore,
# the same pattern as the other apps in this lane (Checkout IQ / HydroPet /
# Snake / RideOffer). No EAS account or token is involved.

on:
  workflow_dispatch:

concurrency:
  group: answerforu-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK platform 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (generate android/)
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Install pinned NDK / CMake if the generated project requests them
        run: |
          NDK="$(grep -rhoP 'ndkVersion[^0-9]*\K[0-9]+\.[0-9]+\.[0-9]+' android/ --include=build.gradle | head -1 || true)"
          if [ -n "${NDK:-}" ]; then echo "Installing ndk;$NDK"; sdkmanager "ndk;$NDK"; fi
          sdkmanager "cmake;3.22.1" || true

      - name: Inject env-var signing into generated android tree (CI only)
        run: python3 ci/apply-signing.py

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          ls -l "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Verify AAB signature and print signer fingerprints
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          jarsigner -verify "$AAB"
          echo "--- signer certificate fingerprints ---"
          keytool -printcert -jarfile "$AAB" | grep -E "SHA1:|SHA256:" || true

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: AnswerForU-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
