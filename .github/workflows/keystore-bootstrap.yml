name: Keystore bootstrap (one-time)

# One-time: generates the AnswerForU upload keystore (no JDK on the local VM),
# exactly like the other apps in this lane. Download the artifact, back the
# keystore + password up locally, set the repo secrets, then DELETE this
# workflow file.

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate upload keystore
        run: |
          set -euo pipefail
          PW="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 28)"
          printf '%s' "$PW" > keystore-password.txt
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=AnswerForU, O=AnswerForU, C=US"
          echo "--- fingerprints (SHA1 needed for the Google OAuth Android client) ---"
          keytool -list -v -keystore upload-keystore.jks -storepass "$PW" | grep -E "Alias name:|SHA1:|SHA256:" || true

      - name: Upload keystore bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: answerforu-keystore-bootstrap
          path: |
            upload-keystore.jks
            keystore-password.txt
          retention-days: 1
